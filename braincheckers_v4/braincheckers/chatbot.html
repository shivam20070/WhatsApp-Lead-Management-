<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Brain Checkers — Book a Session</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f4f7fb;--surface:#e3d7d7;--surface2:#4db6ac;--surface3:#1a2b3e;--surface4:#213347;
  --teal:#0af0d8;--teal2:#08c4b0;--teal-dim:rgba(10,240,216,.12);--teal-glow:rgba(10,240,216,.2);
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,.1);
  --blue:#4f8ff7;--blue-dim:rgba(79,143,247,.1);
  --green:#22d87a;--green-dim:rgba(34,216,122,.1);
  --rose:#f43f72;--rose-dim:rgba(244,63,114,.1);
  --violet:#a855f7;--violet-dim:rgba(168,85,247,.1);
  --text:#e2edf8;--muted:#5a7896;--dimtext:#8baec8;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --radius:16px;--rad-sm:10px;--rad-xs:8px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);display:flex;flex-direction:column;align-items:center;}

/* ── GRID BG ── */
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;opacity:.5;}
.glow-orb{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(10,240,216,.06),transparent 60%);top:-200px;left:50%;transform:translateX(-50%);pointer-events:none;}

/* ── TOPBAR ── */
.topbar{width:100%;max-width:760px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10;flex-shrink:0;}
.topbar img{height:42px;object-fit:contain;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.live-pill{display:flex;align-items:center;gap:6px;background:var(--green-dim);border:1px solid rgba(34,216,122,.2);border-radius:20px;padding:5px 12px;}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,216,122,.6);}60%{box-shadow:0 0 0 5px rgba(34,216,122,0);}}
.live-pill span{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.4px;}
.admin-btn{color:var(--muted);font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--border2);border-radius:var(--rad-xs);padding:7px 13px;transition:.2s;letter-spacing:.3px;}
.admin-btn:hover{color:var(--teal);border-color:rgba(10,240,216,.3);}

/* ── HERO ── */
.hero{text-align:center;padding:8px 20px 14px;position:relative;z-index:1;flex-shrink:0;}
.hero h1{font-size:22px;font-weight:900;color:#88a7c5;line-height:1.2;}
.hero h1 em{font-style:normal;color:var(--teal);}
.hero p{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.3px;}

/* ── CHAT WRAP ── */
.chat-wrap{width:100%;max-width:720px;margin:0 auto;padding:0 12px 12px;display:flex;flex-direction:column;flex:1;min-height:0;position:relative;z-index:1;}
.chat-box{background:var(--surface);border:1px solid var(--border2);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.chat-header{padding:14px 18px;background:linear-gradient(135deg,#0c1928,#0f2239);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.chat-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 20px var(--teal-glow);flex-shrink:0;}
.chat-header-info h3{font-size:14px;font-weight:800;color:var(--text);}
.chat-header-info p{font-size:11px;color:var(--muted);}
.steps-pill{margin-left:auto;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-dim);border:1px solid rgba(10,240,216,.2);border-radius:12px;padding:4px 10px;}

/* ── PROGRESS ── */
.progress-bar{height:2px;background:var(--surface3);flex-shrink:0;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:width .5s cubic-bezier(.4,0,.2,1);}

/* ── MESSAGES ── */
#messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;}
#messages::-webkit-scrollbar{width:3px;}
#messages::-webkit-scrollbar-thumb{background:var(--surface4);border-radius:2px;}

/* ── BUBBLE ── */
.bwrap{display:flex;flex-direction:column;gap:3px;animation:slideUp .25s cubic-bezier(.34,1.56,.64,1);}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.bwrap.user{align-items:flex-end;}
.bwrap.bot,.bwrap.error,.bwrap.system{align-items:flex-start;}
.bubble{max-width:80%;padding:11px 15px;border-radius:16px;font-size:13.5px;line-height:1.6;word-break:break-word;}
.bubble.bot{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text);}
.bubble.user{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#080f1a;font-weight:700;border-bottom-right-radius:4px;}
.bubble.error{background:var(--rose-dim);border:1px solid rgba(244,63,114,.2);border-bottom-left-radius:4px;color:#fc8fae;}
.btime{font-size:10px;color:var(--muted);padding:0 4px;}

/* ── TYPING ── */
.typing{display:flex;gap:5px;align-items:center;background:var(--surface2);border:1px solid var(--border);padding:12px 16px;border-radius:16px;border-bottom-left-radius:4px;width:fit-content;}
.typing span{width:6px;height:6px;background:var(--teal);border-radius:50%;animation:bounce .9s infinite;}
.typing span:nth-child(2){animation-delay:.18s;}
.typing span:nth-child(3){animation-delay:.36s;}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.3;}50%{transform:translateY(-5px);opacity:1;}}

/* ── CARD BASE ── */
.card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:16px;max-width:92%;animation:slideUp .3s ease;}
.card-title{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;margin-bottom:12px;}

/* ── CATEGORY CARD ── */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.cat-btn{border:2px solid var(--border2);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:.2s;background:var(--surface3);position:relative;overflow:hidden;}
.cat-btn::before{content:'';position:absolute;inset:0;opacity:0;transition:.2s;}
.cat-btn.student::before{background:radial-gradient(circle at 50% 0,rgba(10,240,216,.15),transparent 70%);}
.cat-btn.parent::before{background:radial-gradient(circle at 50% 0,rgba(168,85,247,.15),transparent 70%);}
.cat-btn.corporate::before{background:radial-gradient(circle at 50% 0,rgba(245,158,11,.15),transparent 70%);}
.cat-btn:hover::before{opacity:1;}
.cat-btn.student:hover{border-color:var(--teal);transform:translateY(-2px);}
.cat-btn.parent:hover{border-color:var(--violet);transform:translateY(-2px);}
.cat-btn.corporate:hover{border-color:var(--amber);transform:translateY(-2px);}
.cat-icon{font-size:28px;margin-bottom:8px;}
.cat-name{font-size:12.5px;font-weight:800;color:var(--text);}
.cat-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4;}

/* ── TEST CARD ── */
.test-grid{display:flex;flex-direction:column;gap:8px;}
.test-btn{display:flex;align-items:center;gap:12px;background:var(--surface3);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.2s;}
.test-btn:hover{transform:translateX(3px);}
.test-btn.dmit:hover{border-color:var(--teal);background:var(--teal-dim);}
.test-btn.get:hover{border-color:var(--violet);background:var(--violet-dim);}
.test-btn.met:hover{border-color:var(--amber);background:var(--amber-dim);}
.test-btn.sat:hover{border-color:var(--blue);background:var(--blue-dim);}
.test-btn.mat:hover{border-color:var(--green);background:var(--green-dim);}
.test-btn.gat:hover{border-color:var(--rose);background:var(--rose-dim);}
.test-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:900;}
.test-info .test-name{font-size:13px;font-weight:800;color:var(--text);}
.test-info .test-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.test-badge{margin-left:auto;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;}
.test-arrow{margin-left:auto;color:var(--muted);font-size:16px;transition:.2s;}
.test-btn:hover .test-arrow{color:var(--text);transform:translateX(2px);}

/* ── MODE CARD ── */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mode-btn{border:2px solid var(--border2);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;transition:.25s;background:var(--surface3);}
.mode-btn.online:hover{border-color:var(--teal);background:var(--teal-dim);transform:translateY(-3px);}
.mode-btn.offline:hover{border-color:var(--green);background:var(--green-dim);transform:translateY(-3px);}
.mode-icon{font-size:28px;margin-bottom:8px;}
.mode-name{font-size:14px;font-weight:800;color:var(--text);}
.mode-price{font-size:20px;font-weight:900;margin-top:5px;}
.mode-btn.online .mode-price{color:var(--teal);}
.mode-btn.offline .mode-price{color:var(--green);}
.mode-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
.mode-tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;margin-top:8px;display:inline-block;}
.mode-btn.online .mode-tag{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(10,240,216,.2);}
.mode-btn.offline .mode-tag{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,216,122,.2);}

/* ── LOCATION CARD ── */
.loc-card{border-color:rgba(245,158,11,.2);}
.loc-card .card-title{color:var(--amber);}
.loc-detect{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.2s;margin-bottom:12px;}
.loc-detect:hover{background:rgba(245,158,11,.18);}
.loc-detect-info{flex:1;}
.loc-detect-info .ld-title{font-size:13px;font-weight:800;color:var(--text);}
.loc-detect-info .ld-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.loc-detect-icon{font-size:22px;}
.loc-divider{display:flex;align-items:center;gap:10px;margin:10px 0;}
.loc-divider span{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;}
.loc-divider::before,.loc-divider::after{content:'';flex:1;height:1px;background:var(--border2);}
.fr-list{display:flex;flex-direction:column;gap:7px;}
.fr-item{display:flex;align-items:center;gap:11px;background:var(--surface3);border:1.5px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;transition:.2s;}
.fr-item:hover{border-color:var(--amber);background:var(--amber-dim);transform:translateX(2px);}
.fr-ico{width:32px;height:32px;border-radius:8px;background:rgba(245,158,11,.12);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.fr-info .fr-name{font-size:12.5px;font-weight:800;color:var(--text);}
.fr-info .fr-addr{font-size:11px;color:var(--muted);margin-top:1px;}
.fr-arrow{margin-left:auto;color:var(--muted);}
.fr-nearest-badge{font-size:9px;background:var(--teal-dim);color:var(--teal);border:1px solid rgba(10,240,216,.2);padding:2px 7px;border-radius:5px;font-weight:800;margin-left:6px;}

/* ── DATE CARD ── */
.date-card{border-color:rgba(10,240,216,.2);}
.date-card .card-title{color:var(--teal);}
.date-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(max-width:480px){.date-grid{grid-template-columns:repeat(3,1fr);}}
.date-chip{background:var(--surface3);border:1.5px solid var(--border);border-radius:11px;padding:11px 6px;text-align:center;cursor:pointer;transition:.2s;}
.date-chip:hover:not(.no-slots){border-color:var(--teal);background:var(--teal-dim);transform:translateY(-2px);}
.dc-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;}
.dc-num{font-size:20px;font-weight:900;color:var(--text);}
.dc-mon{font-size:10px;color:var(--muted);}
.dc-slots{font-size:10px;color:var(--green);font-weight:700;margin-top:2px;}
.dc-full{font-size:10px;color:var(--rose);font-weight:700;margin-top:2px;}
.date-chip.no-slots{opacity:.4;cursor:not-allowed;}

/* ── SLOT OPTIONS ── */
.slot-grid{display:flex;flex-wrap:wrap;gap:7px;}
.slot-btn{background:var(--surface3);border:1.5px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12.5px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--text);cursor:pointer;transition:.2s;}
.slot-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-dim);}

/* ── QR CARD ── */
.qr-card{border-color:rgba(79,143,247,.25);background:linear-gradient(135deg,var(--blue-dim),var(--surface2));}
.qr-card .card-title{color:var(--blue);}
.qr-amount{font-size:32px;font-weight:900;color:var(--text);text-align:center;margin-bottom:4px;}
.qr-amount span{color:var(--teal);}
.qr-img-wrap{display:flex;justify-content:center;margin:12px 0;}
.qr-img{width:160px;height:160px;border-radius:12px;border:3px solid rgba(255,255,255,.15);object-fit:contain;}
.upi-box{display:flex;align-items:center;gap:8px;background:rgba(10,240,216,.07);border:1px solid rgba(10,240,216,.18);border-radius:8px;padding:8px 12px;margin-bottom:10px;}
.upi-id{font-family:'Space Mono',monospace;font-size:12px;color:var(--teal);flex:1;}
.copy-btn{background:none;border:none;cursor:pointer;font-size:14px;transition:.2s;padding:2px 6px;border-radius:6px;}
.copy-btn:hover{background:var(--teal-dim);}
.qr-hint{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5;}
.confirm-pay-btn{width:100%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#080f1a;border:none;border-radius:10px;padding:13px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;cursor:pointer;margin-top:12px;transition:.18s;letter-spacing:.3px;}
.confirm-pay-btn:hover{opacity:.88;transform:translateY(-1px);}

/* ── MEET CARD ── */
.meet-card{background:linear-gradient(135deg,rgba(59,130,246,.1),var(--surface2));border-color:rgba(79,143,247,.3);}
.meet-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.meet-ico{width:38px;height:38px;border-radius:10px;background:rgba(79,143,247,.15);display:flex;align-items:center;justify-content:center;font-size:18px;}
.meet-head-info h4{font-size:14px;font-weight:800;color:var(--text);}
.meet-head-info p{font-size:11px;color:var(--muted);}
.meet-link-box{background:rgba(79,143,247,.08);border:1px solid rgba(79,143,247,.2);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:8px;margin-bottom:10px;word-break:break-all;}
.meet-link-box span{font-family:'Space Mono',monospace;font-size:11px;color:#93c5fd;flex:1;}
.join-btn{width:100%;background:linear-gradient(135deg,#4f8ff7,#2563eb);color:#fff;border:none;border-radius:10px;padding:12px;font-size:13.5px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;cursor:pointer;transition:.18s;}
.join-btn:hover{opacity:.88;transform:translateY(-1px);}
.share-row{display:flex;gap:8px;margin-top:8px;}
.share-btn{flex:1;padding:9px;border-radius:8px;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;border:none;cursor:pointer;transition:.18s;}
.wa-btn{background:rgba(34,216,122,.15);color:var(--green);border:1px solid rgba(34,216,122,.25);}
.wa-btn:hover{background:rgba(34,216,122,.25);}

/* ── ADDRESS CARD ── */
.addr-card{background:linear-gradient(135deg,var(--amber-dim),var(--surface2));border-color:rgba(245,158,11,.3);}
.addr-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.addr-ico{width:38px;height:38px;border-radius:10px;background:var(--amber-dim);display:flex;align-items:center;justify-content:center;font-size:18px;}
.addr-head-info h4{font-size:14px;font-weight:800;color:var(--text);}
.addr-head-info p{font-size:11px;color:var(--muted);}
.addr-line{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text);line-height:1.5;margin-bottom:8px;}
.addr-line .al-icon{color:var(--amber);flex-shrink:0;margin-top:1px;}
.map-btn{width:100%;background:linear-gradient(135deg,var(--amber),#d97706);color:#1a0a00;border:none;border-radius:10px;padding:12px;font-size:13.5px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;cursor:pointer;transition:.18s;margin-top:8px;}
.map-btn:hover{opacity:.88;transform:translateY(-1px);}

/* ── CONFIRMATION CARD ── */
.confirm-card{border-color:rgba(34,216,122,.25);background:linear-gradient(135deg,var(--green-dim),var(--surface2));}
.confirm-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.confirm-tick{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--green),#16a05a);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 16px rgba(34,216,122,.3);}
.confirm-head h4{font-size:15px;font-weight:900;color:var(--text);}
.confirm-head p{font-size:11px;color:var(--green);}
.confirm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cg-item{background:var(--surface3);border-radius:8px;padding:10px 12px;}
.cg-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.cg-val{font-size:13px;font-weight:800;color:var(--text);margin-top:3px;}

/* ── OPTS ── */
.opts{display:flex;flex-wrap:wrap;gap:8px;max-width:90%;align-self:flex-start;animation:slideUp .3s ease;}
.opt{background:transparent;border:1.5px solid rgba(10,240,216,.4);color:var(--teal);border-radius:20px;padding:8px 16px;font-size:12.5px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.2px;}
.opt:hover{background:var(--teal-dim);border-color:var(--teal);}

/* ── INPUT ── */
.chat-footer{padding:12px 14px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.inp-row{display:flex;gap:9px;align-items:center;}
.inp-wrap{flex:1;display:flex;align-items:center;background:var(--surface3);border:1.5px solid var(--border2);border-radius:25px;padding:0 16px;transition:.25s;}
.inp-wrap:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim);}
#user-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13.5px;font-family:'Plus Jakarta Sans',sans-serif;padding:12px 0;}
#user-input::placeholder{color:var(--muted);}
.send-btn{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#080f1a;font-size:18px;cursor:pointer;box-shadow:0 4px 14px var(--teal-dim);flex-shrink:0;transition:.2s;display:flex;align-items:center;justify-content:center;}
.send-btn:hover{transform:scale(1.08);}
.send-btn svg{width:18px;height:18px;fill:#080f1a;}

/* ── SPINNER ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(10,240,216,.3);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .topbar{padding:10px 14px;}
  .topbar img{height:36px;}
  .hero{padding:6px 14px 10px;}
  .hero h1{font-size:18px;}
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:7px;}
  .cat-icon{font-size:22px;}
  .cat-name{font-size:11px;}
  .mode-grid{grid-template-columns:1fr 1fr;}
  .confirm-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-orb"></div>

<div class="topbar">
  <img src="/static/logo.png" alt="Brain Checkers"/>
  <div class="topbar-right">

<script>
const msgBox = document.getElementById('messages');
const inp    = document.getElementById('user-input');
const progEl = document.getElementById('progress');
const stepLbl= document.getElementById('step-label');
let franchises = [];

const STEPS = {0:0, 1:14, 2:28, 3:28, 4:42, 5:42, 51:55, 6:55, 7:70, 8:85, 9:100};
const STEP_NAMES = {0:'Intro', 1:'Name', 2:'Phone', 3:'Category', 4:'Test', 5:'Mode', 51:'Location', 6:'Date', 7:'Time Slot', 8:'Done', 9:'Done'};

function setStep(s){
  const pct = STEPS[s] || 0;
  progEl.style.width = pct + '%';
  const name = STEP_NAMES[s] || '';
  const num = s==51?6:Math.min(s+1,7);
  stepLbl.textContent = name ? name : ('Step '+num+' of 7');
}

function ts(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function scroll(){ msgBox.scrollTop = msgBox.scrollHeight; }

function addBubble(text, cls){
  const w=document.createElement('div'); w.className='bwrap '+cls;
  const b=document.createElement('div'); b.className='bubble '+cls; b.innerHTML=text;
  const t=document.createElement('div'); t.className='btime'; t.textContent=ts();
  w.appendChild(b); w.appendChild(t); msgBox.appendChild(w); scroll();
  return w;
}

/* ── TEST CARD ── */
const TEST_META = {

  GET: { icon:'🧩', color:'var(--violet)', bg:'var(--violet-dim)', cls:'get',  desc:'General Efficiency Test' },
  MET: { icon:'🧠', color:'var(--amber)',  bg:'var(--amber-dim)',  cls:'met',  desc:'Multiple Efficiency Test' },

/* ── FRANCHISE / LOCATION CARD ── */
async function addLocationCard(autoDetect){
  if(!franchises.length){
    const r=await fetch('/api/franchises'); const d=await r.json(); franchises=d.franchises;
  }
  const w=document.createElement('div'); w.className='bwrap bot';
  const card=document.createElement('div'); card.className='card loc-card';
  
  let nearestId = null;
  if(autoDetect){
    // Try geolocation
    nearestId = await detectNearestFranchise();
  }

  const frList=franchises.map((f,i)=>`
    <div class="fr-item" onclick="pickFranchise(${f.id})">
      <div class="fr-ico">🏢</div>
      <div class="fr-info">
        <div class="fr-name">${f.name}${nearestId===f.id?'<span class="fr-nearest-badge">NEAREST</span>':''}</div>
        <div class="fr-addr">${f.address}</div>
      </div>
      <div class="fr-arrow">›</div>
    </div>`).join('');

  card.innerHTML=`
    <div class="card-title">📍 Select Your Centre</div>
    ${autoDetect?`<div class="loc-detect" onclick="autoPickNearest(${nearestId})">
      <div class="loc-detect-icon">📡</div>
      <div class="loc-detect-info">
        <div class="ld-title">Use Detected Location${nearestId?` · <span style="color:var(--teal)">${franchises.find(f=>f.id===nearestId)?.name||''}</span>`:''}</div>
        <div class="ld-sub">${nearestId?'Nearest centre auto-selected based on your location':'Detecting your location…'}</div>
      </div>
    </div>`:''}
    <div class="loc-divider"><span>OR CHOOSE MANUALLY</span></div>
    <div class="fr-list">${frList}</div>`;
  w.appendChild(card); msgBox.appendChild(w); scroll();
}

async function detectNearestFranchise(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      // Simple nearest by lat/lng distance (franchise coords are approximate)
      const coords={
        1:{lat:18.5076,lng:73.8296}, 2:{lat:18.5204,lng:73.9270},
        3:{lat:19.1209,lng:72.8461}, 4:{lat:19.2183,lng:72.9781},
        5:{lat:21.1460,lng:79.0787}, 6:{lat:28.6315,lng:77.2167}
      };
      const {latitude:lat,longitude:lng}=pos.coords;
      let nearest=null, minD=Infinity;
      for(const [id,c] of Object.entries(coords)){
        const d=Math.sqrt((lat-c.lat)**2+(lng-c.lng)**2);
        if(d<minD){minD=d;nearest=parseInt(id);}
      }
      resolve(nearest);
    },()=>resolve(null),{timeout:4000});
  });
}

function autoPickNearest(fid){
  if(!fid){ return; }
  document.querySelectorAll('.fr-item,.loc-detect').forEach(b=>b.style.pointerEvents='none');
  sendMsg('franchise|'+fid, '📡 Auto-detected nearest centre');
}

function pickFranchise(fid){
  document.querySelectorAll('.fr-item,.loc-detect').forEach(b=>b.style.pointerEvents='none');
  sendMsg('franchise|'+fid, '📍 Centre selected');
}

/* ── DATE CARD ── */
async function addDateCard(){
  const w=document.createElement('div'); w.className='bwrap bot';
  const card=document.createElement('div'); card.className='card date-card';
  const today=new Date();
  const dates=[]; for(let i=0;i<8;i++){const d=new Date(today);d.setDate(today.getDate()+i);dates.push(d.toISOString().split('T')[0]);}
  const counts={};
  await Promise.all(dates.map(async dt=>{
    const r=await fetch('/api/slots?date='+dt); const d=await r.json(); counts[dt]=d.slots.length;
  }));
  let chips='';
  for(let i=0;i<8;i++){
    const d=new Date(today);d.setDate(today.getDate()+i);
    const iso=d.toISOString().split('T')[0];
    const lbl=i===0?'Today':i===1?'Tmrw':d.toLocaleDateString('en-IN',{weekday:'short'});
    const num=d.getDate(); const mon=d.toLocaleDateString('en-IN',{month:'short'});
    const cnt=counts[iso]||0; const full=cnt===0;
    chips+=`<div class="date-chip${full?' no-slots':''}" onclick="${full?'':'pickDate(\''+iso+'\')'}">
      <div class="dc-label">${lbl}</div>
      <div class="dc-num">${num}</div>
      <div class="dc-mon">${mon}</div>
      ${full?'<div class="dc-full">Full</div>':'<div class="dc-slots">'+cnt+' free</div>'}
    </div>`;
  }
  card.innerHTML=`<div class="card-title">📅 Pick Your Date</div><div class="date-grid">${chips}</div>`;
  w.appendChild(card); msgBox.appendChild(w); scroll();
}

function pickDate(iso){
  document.querySelectorAll('.date-chip').forEach(c=>c.style.pointerEvents='none');
  const d=new Date(iso); const fmt=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  sendMsg('date|'+iso,'📅 '+fmt);
}

}

/* ── OPTS ── */
function addOpts(opts){
  if(!opts||!opts.length) return;
  const row=document.createElement('div'); row.className='opts';
  opts.forEach(o=>{
    const display=o.includes('|')?o.split('|')[0]:o;
    const b=document.createElement('button'); b.className='opt'; b.textContent=display;
    b.onclick=()=>{ row.remove(); sendMsg(o,display); };
    row.appendChild(b);
  });
  msgBox.appendChild(row); scroll();
}

/* ── TYPING ── */
function showTyping(){
  const d=document.createElement('div'); d.className='typing'; d.id='typing';
  d.innerHTML='<span></span><span></span><span></span>';
  msgBox.appendChild(d); scroll();
}

/* ── SEND ── */
async function sendMsg(val, display){
  const msg=val||inp.value.trim(); if(!msg) return;
  const shown=display!==undefined?display:msg;
  if(!val) inp.value='';
  addBubble(shown,'user');
  showTyping();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const data=await r.json();
    document.getElementById('typing')?.remove();
    
    if(data.step!==undefined) setStep(data.step);
    
    let slotOptsHandled=false;
    for(const [type,content] of data.responses){
      await new Promise(res=>setTimeout(res,160));
      if(type==='category_select'){ addCategoryCard(); }
      else if(type==='test_select'){ addTestCard(JSON.parse(content)); }
      else if(type==='mode_select'){ addModeCard(); }
      else if(type==='franchise_select'){ await addLocationCard(true); }
      else if(type==='date_select'){ await addDateCard(); }
      else if(type==='slot_select'){ addSlotGrid(JSON.parse(content)); slotOptsHandled=true; }
      else if(type==='qr'){ addQR(content); }
      else if(type==='meet'){ addMeet(content); }
      else if(type==='address'){ addAddress(content); }
      else if(type==='confirmation'){ addConfirmation(JSON.parse(content)); }
      else if(type==='bot'||type==='error'){ addBubble(content,type); }
    }
    if(!slotOptsHandled && data.options && data.options.length) addOpts(data.options);
  }catch(e){
    document.getElementById('typing')?.remove();
    addBubble('Connection error. Please try again.','error');
  }
}

inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey) sendMsg(); });

/* ── INIT ── */
(async()=>{
  await fetch('/api/reset',{method:'POST'});
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:''})});
  const d=await r.json();
  if(d.step!==undefined) setStep(d.step);
  for(const [type,content] of d.responses){
    if(type==='category_select') addCategoryCard();
    else if(type==='bot'||type==='error') addBubble(content,type);
  }
  if(d.options) addOpts(d.options);
})();
</script>
